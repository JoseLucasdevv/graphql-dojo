
spring:
  application:
    name: graphql
  h2:
    console:
      enabled: true
  datasource:
    username: sa
    password: password
    url: jdbc:h2:mem:database
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  graphql:
    graphiql:
      enabled: true

